<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrativo - Mis 15 Abigail</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0; font-family: 'Montserrat', sans-serif;
            background: url('iconoboladisco.jpg') no-repeat center center fixed;
            background-size: cover; color: white; display: flex; justify-content: center; padding: 20px;
        }
        .overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index: -1; }
        .glass {
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 20px;
            padding: 30px; width: 100%; max-width: 1100px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        h1 { font-family: 'Cinzel', serif; text-align: center; }
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { border-bottom: 2px solid white; padding: 12px; text-align: left; }
        td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .btn-wa { background: #25d366; color: white; padding: 5px 10px; border-radius: 5px; text-decoration: none; font-size: 0.8rem; }
    </style>
</head>
<body>
    <div class="overlay"></div>
    <div class="glass">
        <h1>Control de Invitados</h1>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Estado</th>
                        <th>Música</th>
                        <th>Menú</th>
                        <th>Chat</th>
                    </tr>
                </thead>
                <tbody id="lista-admin"></tbody>
            </table>
        </div>
    </div>
    <script type="module">
        import { db } from './firebase-config.js';
        import { collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        const cuerpo = document.getElementById('lista-admin');
        onSnapshot(query(collection(db, "helena"), orderBy("fecha", "desc")), (snap) => {
            cuerpo.innerHTML = "";
            snap.forEach(doc => {
                const d = doc.data();
                const fila = document.createElement('tr');
                fila.innerHTML = `
                    <td>${d.nombre}</td>
                    <td style="color:${d.asistencia==='si'?'#00ff88':'#ff4d4d'}; font-weight:bold;">${d.asistencia==='si'?'ASISTE':'NO ASISTE'}</td>
                    <td>${d.musica || '-'}</td>
                    <td><strong>${d.menu}</strong><br><small>${d.menuDetalle || ''}</small></td>
                    <td><a href="https://wa.me/${d.telefono}" class="btn-wa" target="_blank">WhatsApp</a></td>
                `;
                cuerpo.appendChild(fila);
            });
        });
    </script>
</body>
</html>
